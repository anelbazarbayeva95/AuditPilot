name: CI

# The checks a contributor runs locally (see CLAUDE.md → Commands), run on
# every PR and on main. build-backend.yml only builds the Docker image; it
# doesn't run a single test.
#
# The backend suite runs entirely on fakes (no Gemini key, no network, no
# Playwright browsers), so a plain `pip install` is all it needs.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches backend/Dockerfile's base image.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `build` is `tsc -b && vite build` — typecheck plus production bundle.
      - name: Typecheck and build
        run: npm run build
