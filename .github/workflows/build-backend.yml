name: Build backend image

# Builds backend/Dockerfile and pushes it to GitHub Container Registry.
#
# This exists because Azure Container Registry's remote build (ACR Tasks) is
# blocked on Azure for Students / free-tier subscriptions as an anti-abuse
# measure — there's no local Docker daemon in Azure Cloud Shell either, so
# GitHub's own runners (which do have one) are the path of least resistance
# for building an image that needs Playwright's Chromium + Node/lighthouse
# without any local tooling.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/project-progress-check-0037l5
    paths:
      - "backend/**"
      - ".github/workflows/build-backend.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/auditpilot-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
