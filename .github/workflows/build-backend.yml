name: Build backend image

# Builds backend/Dockerfile and pushes it to GitHub Container Registry.
#
# This exists because Azure Container Registry's remote build (ACR Tasks) is
# blocked on Azure for Students / free-tier subscriptions as an anti-abuse
# measure — there's no local Docker daemon in Azure Cloud Shell either, so
# GitHub's own runners (which do have one) are the path of least resistance
# for building an image that needs Playwright's Chromium + Node/lighthouse
# without any local tooling.
#
# NOTE: this only builds and pushes the image to ghcr.io — it does not
# trigger Azure Container Apps to pull it. Azure caches whatever image
# digest a revision was created with, so pushing a new `:latest` here does
# NOT auto-redeploy the running container app. After this workflow
# completes, create a new revision in the Azure Portal (or run
# `az containerapp update --image ghcr.io/<owner>/auditpilot-backend:latest`)
# to actually roll the new image out.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/build-backend.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/auditpilot-backend:latest
            ghcr.io/${{ github.repository_owner }}/auditpilot-backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
